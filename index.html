<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>불사 공략실</title>
<style>
:root{--bg:#090909;--panel:#151515;--panel2:#202020;--red:#e52525;--red2:#ff4b22;--gold:#ffc83d;--text:#fff;--muted:#aaa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#3a0905 0,#100605 32%,#070707 75%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.wrap{max-width:520px;margin:auto;min-height:100vh;padding:18px 14px 36px}
.logo{text-align:center;font-weight:1000;font-size:48px;letter-spacing:-5px;text-shadow:0 0 15px #ff2a00,2px 3px 0 #6d0900;margin:8px 0 2px}.sub{text-align:center;color:#ffd38a;font-weight:700;margin-bottom:24px}
.card{background:linear-gradient(145deg,#1d1d1d,#101010);border:1px solid #3a3a3a;border-radius:18px;padding:18px;box-shadow:0 8px 30px #0008;margin-bottom:14px}.hero{border-color:#76200f;background:linear-gradient(145deg,#32100b,#121212)}
h1,h2,h3{margin:0 0 12px}h2{font-size:21px}.small{font-size:13px;color:var(--muted)}
input,textarea,select{width:100%;background:#090909;border:1px solid #454545;border-radius:12px;color:white;padding:13px;margin:6px 0 10px;outline:none}textarea{min-height:180px;resize:vertical}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:900;color:white;background:linear-gradient(135deg,var(--red),#a80d0d);width:100%;box-shadow:0 5px 16px #e00 2px}.btn.secondary{background:#2b2b2b;box-shadow:none}.btn.gold{background:linear-gradient(135deg,#ffbd22,#d66d00);color:#1b0c00}.row{display:flex;gap:8px}.row>*{flex:1}
.tabs{display:flex;gap:8px;overflow:auto;margin:10px 0 15px}.tab{white-space:nowrap;border:1px solid #444;background:#171717;color:#bbb;border-radius:999px;padding:9px 13px;font-weight:800}.tab.active{background:#d91c1c;color:#fff;border-color:#ff4444}
.post{padding:15px;border-radius:14px;background:#171717;border:1px solid #333;margin:9px 0}.post .title{font-size:17px;font-weight:900}.badge{display:inline-block;background:#65100d;color:#ffb2a5;border:1px solid #8d2920;border-radius:999px;padding:3px 8px;font-size:11px;margin-bottom:7px}.post-body{white-space:pre-wrap;line-height:1.65;color:#ddd;margin-top:12px}.post-img{max-width:100%;border-radius:12px;margin-top:10px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.iconbtn{background:#171717;color:#fff;border:1px solid #444;border-radius:10px;padding:8px 11px}
.notice{padding:12px;border-radius:12px;background:#24170a;border:1px solid #674514;color:#ffd98a;font-size:13px;line-height:1.5}
.member{display:flex;align-items:center;justify-content:space-between;background:#171717;border:1px solid #333;padding:12px;border-radius:12px;margin:7px 0}.member strong{display:block}.member span{font-size:12px;color:#aaa}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:10}.modalbox{width:min(520px,100%);max-height:90vh;overflow:auto;background:#151515;border:1px solid #444;border-radius:20px;padding:18px}
.footer{text-align:center;color:#666;font-size:11px;margin-top:25px}
hr{border:0;border-top:1px solid #333;margin:18px 0}
</style>
</head>
<body>
<div class="wrap">
  <section id="loginView">
    <div class="logo">불사</div>
    <div class="sub">🔥 불사 길드 전용 공략실</div>
    <div class="card hero">
      <h2>길드원 전용 입장</h2>
      <div class="small">닉네임과 접속 암호를 입력하세요.</div>
      <input id="loginNick" placeholder="닉네임">
      <input id="loginPass" type="password" placeholder="접속 암호">
      <button class="btn" onclick="login()">입장하기</button>
      <div style="height:8px"></div>
      <button class="btn secondary" onclick="showRegister()">처음 오셨나요? 가입 신청</button>
      <div id="loginMsg" class="small" style="margin-top:10px;color:#ff8f80"></div>
    </div>
    <div class="notice">관리자 비밀번호는 화면이나 소스코드에 저장하지 않습니다.</div>
    <div style="height:10px"></div>
    <button class="btn gold" onclick="adminLogin()">🔐 관리자 페이지</button>
  </section>

  <section id="appView" class="hidden">
    <div class="topbar"><div><b>🔥 불사 공략실</b><div class="small" id="who"></div></div><button class="iconbtn" onclick="logout()">로그아웃</button></div>
    <div class="tabs">
      <button class="tab active" onclick="setCategory('전체',this)">전체</button>
      <button class="tab" onclick="setCategory('길드전',this)">⚔️ 길드전</button>
      <button class="tab" onclick="setCategory('강림',this)">🔥 강림</button>
      <button class="tab" onclick="setCategory('파괴신',this)">💀 파괴신</button>
    </div>
    <div class="card hero">
      <h2 id="welcome">불사 공략실</h2>
      <div class="small">길드원끼리 공략을 공유하는 공간입니다.</div>
    </div>
    <div id="postList"></div>
    <div id="writeArea" class="hidden"><button class="btn" onclick="openPostEditor()">✍️ 공략 작성</button></div>
    <div class="footer">불사 길드 · 첫 번째 버전</div>
  </section>

  <section id="adminView" class="hidden">
    <div class="topbar"><div><b>🔐 관리자 페이지</b><div class="small">불사 길드 관리</div></div><button class="iconbtn" onclick="goLogin()">나가기</button></div>
    <div class="card">
      <h2>사이트 설정</h2>
      <label class="small">회원 접속 암호</label>
      <input id="sitePass">
      <button class="btn" onclick="saveSitePass()">암호 저장</button>
    </div>
    <div class="card">
      <h2>가입 신청</h2><div id="requests"></div>
    </div>
    <div class="card">
      <h2>길드원 관리</h2><div id="members"></div>
    </div>
    <div class="card">
      <h2>공략 관리</h2><div id="adminPosts"></div>
    </div>
  </section>
</div>

<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>

<script>
const KEY='bulsa_v1';
const defaultData={
  sitePass:'1234',
  members:[{id:'admin',nick:'관리자',approved:true,admin:true},{id:'sample',nick:'김영준',approved:true,admin:false}],
  requests:[],
  posts:[
    {id:1,cat:'길드전',title:'길드전 기본 공격 순서',body:'1. 상대 방어덱을 먼저 확인합니다.\\n2. 추천 공격덱을 확인합니다.\\n3. 공격 전에 길드원과 중복 여부를 확인합니다.',author:'관리자',date:'2026-10-04'},
    {id:2,cat:'강림',title:'강림 초보자 공략',body:'여기에 강림 공략 내용을 작성하세요. 이미지도 추가할 수 있습니다.',author:'관리자',date:'2026-10-04'}
  ]
};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||defaultData;
let session=null, category='전체';
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function $(id){return document.getElementById(id)}
function show(id){['loginView','appView','adminView'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}
function login(){
 const nick=$('loginNick').value.trim(), pass=$('loginPass').value;
 const m=data.members.find(x=>x.nick===nick && x.approved);
 if(!m){$('loginMsg').textContent='승인된 길드원이 아닙니다. 가입 신청을 해주세요.';return}
 if(pass!==data.sitePass){$('loginMsg').textContent='접속 암호가 틀렸습니다.';return}
 session=m; category='전체'; show('appView'); render();
}
function adminLogin(){
 alert('이 구버전 관리자 로그인은 비활성화되었습니다. Supabase 관리자 계정으로 로그인하세요.')
}
function logout(){session=null;goLogin()}
function goLogin(){show('loginView')}
function setCategory(c,el){category=c;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function render(){
 $('who').textContent=session.nick+'님 환영합니다.';
 $('welcome').textContent=category==='전체'?'불사 공략실':category+' 공략';
 const posts=data.posts.filter(p=>category==='전체'||p.cat===category);
 $('postList').innerHTML=posts.length?posts.map(p=>`<div class="post"><span class="badge">${p.cat}</span><div class="title">${esc(p.title)}</div><div class="small">${esc(p.author)} · ${p.date}</div><div class="post-body">${esc(p.body)}</div>${p.image?`<img class="post-img" src="${p.image}">`:''}</div>`).join(''):'<div class="card"><div class="small">등록된 공략이 없습니다.</div></div>';
 $('writeArea').classList.toggle('hidden',!session?.admin);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function showRegister(){
 $('modalBox').innerHTML=`<h2>가입 신청</h2><div class="small">관리자 승인 후 사이트를 이용할 수 있습니다.</div><input id="regNick" placeholder="게임 닉네임"><button class="btn" onclick="register()">가입 신청</button><div style="height:8px"></div><button class="btn secondary" onclick="closeModal()">닫기</button>`;
 $('modal').classList.remove('hidden');
}
function register(){const n=$('regNick').value.trim();if(!n)return alert('닉네임을 입력하세요.');if(data.members.some(x=>x.nick===n)||data.requests.some(x=>x.nick===n))return alert('이미 존재하거나 신청 중입니다.');data.requests.push({id:Date.now(),nick:n});save();closeModal();alert('가입 신청이 접수되었습니다. 관리자 승인을 기다려주세요.')}
function openPostEditor(id=null){
 const p=id?data.posts.find(x=>x.id===id):null;
 $('modalBox').innerHTML=`<h2>${p?'공략 수정':'공략 작성'}</h2>
 <select id="pCat"><option ${p?.cat==='길드전'?'selected':''}>길드전</option><option ${p?.cat==='강림'?'selected':''}>강림</option><option ${p?.cat==='파괴신'?'selected':''}>파괴신</option></select>
 <input id="pTitle" placeholder="제목" value="${esc(p?.title||'')}">
 <textarea id="pBody" placeholder="공략 내용을 작성하세요.">${esc(p?.body||'')}</textarea>
 <input id="pImage" placeholder="이미지 URL (선택)">
 <button class="btn" onclick="savePost(${p?.id||0})">저장</button><div style="height:8px"></div><button class="btn secondary" onclick="closeModal()">취소</button>`;
 $('modal').classList.remove('hidden');
}
function savePost(id){
 const post={id:id||Date.now(),cat:$('pCat').value,title:$('pTitle').value.trim(),body:$('pBody').value.trim(),image:$('pImage').value.trim(),author:session.nick,date:new Date().toISOString().slice(0,10)};
 if(!post.title)return alert('제목을 입력하세요.');
 if(id){const i=data.posts.findIndex(x=>x.id===id);data.posts[i]=post}else data.posts.unshift(post);
 save();closeModal();render();
}
function closeModal(){$('modal').classList.add('hidden')}
function saveSitePass(){const p=$('sitePass').value.trim();if(p.length<4)return alert('4자리 이상 입력하세요.');data.sitePass=p;save();alert('회원 접속 암호가 저장되었습니다.')}
function renderAdmin(){
 $('sitePass').value=data.sitePass;
 $('requests').innerHTML=data.requests.length?data.requests.map(r=>`<div class="member"><div><strong>${esc(r.nick)}</strong><span>가입 신청</span></div><div class="row"><button class="iconbtn" onclick="approve(${r.id})">승인</button><button class="iconbtn" onclick="deny(${r.id})">거절</button></div></div>`).join(''):'<div class="small">가입 신청이 없습니다.</div>';
 $('members').innerHTML=data.members.map(m=>`<div class="member"><div><strong>${esc(m.nick)} ${m.admin?'👑':''}</strong><span>${m.admin?'관리자':'길드원'}</span></div>${m.admin?'':`<button class="iconbtn" onclick="kick('${m.id}')">추방</button>`}</div>`).join('');
 $('adminPosts').innerHTML=data.posts.map(p=>`<div class="member"><div><strong>${esc(p.title)}</strong><span>${p.cat} · ${p.author}</span></div><div class="row"><button class="iconbtn" onclick="openPostEditor(${p.id})">수정</button><button class="iconbtn" onclick="deletePost(${p.id})">삭제</button></div></div>`).join('');
}
function approve(id){const r=data.requests.find(x=>x.id===id);if(!r)return;data.members.push({id:'m'+Date.now(),nick:r.nick,approved:true,admin:false});data.requests=data.requests.filter(x=>x.id!==id);save();renderAdmin()}
function deny(id){data.requests=data.requests.filter(x=>x.id!==id);save();renderAdmin()}
function kick(id){const m=data.members.find(x=>x.id===id);if(!m)return;if(confirm(`${m.nick} 님을 추방할까요?`)){data.members=data.members.filter(x=>x.id!==id);save();renderAdmin()}}
function deletePost(id){if(confirm('이 공략을 삭제할까요?')){data.posts=data.posts.filter(x=>x.id!==id);save();renderAdmin()}}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
</script>
</body>
</html>
