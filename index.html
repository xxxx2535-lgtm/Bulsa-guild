:root{--red:#e52525;--gold:#ffc83d;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#3a0905 0,#100605 32%,#070707 75%);color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}.hidden{display:none!important}.wrap{max-width:520px;margin:auto;min-height:100vh;padding:18px 14px 36px}.logo{text-align:center;font-weight:1000;font-size:48px;letter-spacing:-5px;text-shadow:0 0 15px #ff2a00,2px 3px 0 #6d0900;margin:8px 0 2px}.sub{text-align:center;color:#ffd38a;font-weight:700;margin-bottom:24px}.card{background:linear-gradient(145deg,#1d1d1d,#101010);border:1px solid #3a3a3a;border-radius:18px;padding:18px;box-shadow:0 8px 30px #0008;margin-bottom:14px}.hero{border-color:#76200f;background:linear-gradient(145deg,#32100b,#121212)}h2{margin:0 0 12px;font-size:21px}.small{font-size:13px;color:var(--muted)}input,textarea,select{width:100%;background:#090909;border:1px solid #454545;border-radius:12px;color:#fff;padding:13px;margin:6px 0 10px;outline:none}textarea{min-height:180px;resize:vertical}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--red),#a80d0d);width:100%;cursor:pointer}.btn.secondary{background:#2b2b2b}.btn.gold{background:linear-gradient(135deg,#ffbd22,#d66d00);color:#1b0c00}.tabs{display:flex;gap:8px;overflow:auto;margin:10px 0 15px}.tab{white-space:nowrap;border:1px solid #444;background:#171717;color:#bbb;border-radius:999px;padding:9px 13px;font-weight:800}.tab.active{background:#d91c1c;color:#fff}.post{padding:15px;border-radius:14px;background:#171717;border:1px solid #333;margin:9px 0}.post .title{font-size:17px;font-weight:900}.post-author{font-size:13px;color:#ffcc8a;font-weight:800;margin-top:6px}.badge{display:inline-block;background:#65100d;color:#ffb2a5;border:1px solid #8d2920;border-radius:999px;padding:3px 8px;font-size:11px;margin-bottom:7px}.post-body{white-space:pre-wrap;line-height:1.65;color:#ddd;margin-top:12px}.post-img{max-width:100%;border-radius:12px;margin-top:10px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.iconbtn{background:#171717;color:#fff;border:1px solid #444;border-radius:10px;padding:8px 11px}.notice{padding:12px;border-radius:12px;background:#24170a;border:1px solid #674514;color:#ffd98a;font-size:13px;line-height:1.5}.member{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#171717;border:1px solid #333;padding:12px;border-radius:12px;margin:7px 0}.member strong{display:block}.member span{font-size:12px;color:#aaa}.row{display:flex;gap:7px}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:10}.modalbox{width:min(520px,100%);max-height:90vh;overflow:auto;background:#151515;border:1px solid #444;border-radius:20px;padding:18px}.home-image{width:100%;display:block;border-radius:18px;border:1px solid #76200f;box-shadow:0 8px 30px #0008;margin-bottom:14px}.footer{text-align:center;color:#666;font-size:11px;margin-top:25px}
.searchbox{position:relative;margin:0 0 12px}.searchbox input{padding-left:40px;margin:0}.searchicon{position:absolute;left:14px;top:13px;color:#aaa}.post-actions{display:flex;gap:7px;margin-top:12px}.post-actions button{flex:1}.image-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.image-grid img{width:100%;height:150px;object-fit:cover;border-radius:12px}.upload-label{display:block;border:1px dashed #666;border-radius:12px;padding:14px;text-align:center;margin:6px 0 10px;background:#111;font-weight:800;cursor:pointer}.upload-note{font-size:12px;color:#aaa;margin:-4px 0 10px}

.battle-top{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.leaderbox{background:linear-gradient(145deg,#42120b,#17100c);border:1px solid #8b321e;border-radius:14px;padding:12px;text-align:center}.leaderbox b{color:#ffd36d}.leader-name{font-size:19px;font-weight:1000;margin:5px 0}.rankline{font-size:13px;color:#ddd;margin:5px 0}.missing-name{color:#ff5a4f!important}.notice-home{border:2px solid #ff9c24;background:linear-gradient(145deg,#481608,#1a0d08);box-shadow:0 0 18px #ff5a002b}.notice-home h2{color:#ffd45f}.battle-row{background:#171717;border:1px solid #333;border-radius:12px;padding:12px;margin:8px 0}.battle-row-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.battle-stats{font-size:13px;color:#ddd;margin-top:7px;line-height:1.6}.mini-btn{border:1px solid #555;background:#242424;color:#fff;border-radius:9px;padding:7px 9px;font-weight:800}.season-title{text-align:center;color:#ffd38a;font-weight:900;margin-bottom:10px}.admin-tools{border:1px solid #5c3415;background:#21150c;border-radius:14px;padding:12px;margin-top:12px}

</head><body><div class="wrap">
<section id="loginView"><div class="logo">불사</div><div class="sub">🔥 불사 길드 전용 공략실</div><div class="card hero"><h2>길드원 전용 입장</h2><div class="small">가입한 닉네임과 비밀번호를 입력하세요.</div><input id="loginEmail" placeholder="닉네임"><input id="loginPass" type="password" placeholder="비밀번호"><button class="btn" onclick="login()">입장하기</button><div style="height:8px"></div><button class="btn secondary" onclick="showRegister()">처음 오셨나요? 가입 신청</button><div id="loginMsg" class="small" style="margin-top:10px;color:#ff8f80"></div></div><div class="notice">🔒 비밀번호는 이 화면이나 소스코드에 저장되지 않습니다.</div></section>
<section id="appView" class="hidden"><div class="topbar bulsa-header">
  <div class="logo-block">
    <img src="./bulsa-banner.png?v=2" alt="불사 길드 배너">
  </div>
  <div class="header-actions">
    <button class="iconbtn" onclick="openMyPage()">마이페이지</button>
    <button class="iconbtn" onclick="logout()">로그아웃</button>
  </div>
</div>
<div class="searchbox"><span class="searchicon">🔎</span><input id="searchInput" placeholder="제목 검색 (단어 일부만 입력해도 됩니다)" oninput="renderPosts()"></div><div class="tabs"><button class="tab active" onclick="setCategory('홈',this)">🏠 홈</button><button class="tab" onclick="setCategory('전체',this)">전체</button><button class="tab" onclick="setCategory('길드전',this)">⚔️ 길드전</button><button class="tab" onclick="setCategory('전적',this)">📊 전적</button><button class="tab" onclick="setCategory('공성전',this)">🏰 공성전</button><button class="tab" onclick="setCategory('파괴신',this)">💀 파괴신</button></div><div class="card hero"><h2 id="welcome">불사 공략실</h2><div class="small">승인된 길드원은 누구나 공략을 작성할 수 있습니다.</div></div><div id="postList"></div><div id="writeArea"><button class="btn" onclick="openPostEditor(null,{category:category})">✍️ 공략 작성</button><div id="adminBtn" class="hidden" style="height:8px"></div><button id="adminButton" class="btn gold hidden" onclick="openAdmin()">🔐 관리자 페이지</button></div><div class="footer">불사 길드</div></section>
<section id="adminView" class="hidden"><div class="topbar"><div><b>🔐 관리자 페이지</b><div class="small">가입 승인 · 추방 · 공략 관리</div></div><button class="iconbtn" onclick="backApp()">돌아가기</button></div><div class="card"><h2>가입 신청 / 길드원 관리</h2><div id="members"></div></div><div class="card"><h2>공략 관리</h2><div id="adminPosts"></div></div></section>
</div><div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ltvpxypdxtaxfnivmgni.supabase.co';
const SUPABASE_KEY='sb_publishable_AKTOoPDYpcvX2qUfiYoH0Q_dNS4t9Sc';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let member=null,posts=[],category='홈',battleMembers=[],battleRecords=[],activeSeason=null,noticeRow=null;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function show(id){['loginView','appView','adminView'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}
function nickEmail(n){return encodeURIComponent(n.trim().toLowerCase())+'@bulsa-guild.local'}
async function login(){ $('loginMsg').textContent='로그인 중...'; const nickname=$('loginEmail').value.trim(),password=$('loginPass').value; if(!nickname||!password){$('loginMsg').textContent='닉네임과 비밀번호를 입력해주세요.';return} const email=nickEmail(nickname); const {data,error}=await sb.auth.signInWithPassword({email,password}); if(error){$('loginMsg').textContent='로그인 실패: 닉네임 또는 비밀번호를 확인해주세요.';return} await enterWithUser(data.user); }
async function enterWithUser(user){ const {data:m,error}=await sb.from('members').select('*').eq('id',user.id).maybeSingle(); if(error){$('loginMsg').textContent='회원정보 확인 오류: '+error.message;return} if(!m){await sb.auth.signOut();$('loginMsg').textContent='가입 신청 정보가 없습니다.';return} if(!m.approved){await sb.auth.signOut();$('loginMsg').textContent='아직 관리자 승인을 기다리는 중입니다.';return} member=m; $('who').textContent=(m.nickname||user.email)+'님 환영합니다.'; show('appView'); $('writeArea').classList.remove('hidden'); $('adminButton').classList.toggle('hidden',!m.is_admin); $('adminBtn').classList.toggle('hidden',!m.is_admin); await loadPosts(); await loadBattleData(); }
async function logout(){await sb.auth.signOut();member=null;show('loginView')}
function showRegister(){ $('modalBox').innerHTML=`<h2>가입 신청</h2><div class="small">닉네임과 비밀번호로 가입 신청하고 관리자 승인을 기다려주세요.</div><input id="regNick" placeholder="게임 닉네임"><input id="regPass" type="password" placeholder="비밀번호 (6자 이상)"><button class="btn" onclick="register()">가입 신청</button><div style="height:8px"></div><button class="btn secondary" onclick="closeModal()">닫기</button>`;$('modal').classList.remove('hidden')}
async function register(){const nickname=$('regNick').value.trim(),password=$('regPass').value;if(!nickname||password.length<6)return alert('닉네임과 6자 이상 비밀번호를 입력해주세요.');if(nickname.length>30)return alert('닉네임은 30자 이하로 입력해주세요.');const email=nickEmail(nickname);const {data,error}=await sb.auth.signUp({email,password,options:{data:{nickname}}});if(error){if(String(error.message).toLowerCase().includes('already')||String(error.message).toLowerCase().includes('registered'))return alert('이미 사용 중인 닉네임입니다.');return alert('가입 실패: '+error.message)}closeModal();alert('가입 신청 완료! 관리자 승인을 기다려주세요.');await sb.auth.signOut()}
async function loadPosts(){const {data,error}=await sb.from('guides').select('*').order('created_at',{ascending:false});if(error){$('postList').innerHTML=`<div class="card"><div class="small">공략 불러오기 오류: ${esc(error.message)}</div></div>`;return}const {data:memberRows}=await sb.from('members').select('id,nickname');const nicknameById=Object.fromEntries((memberRows||[]).map(m=>[String(m.id),m.nickname]));posts=(data||[]).map(p=>({...p,author_nickname:nicknameById[String(p.author_id)]||'알 수 없음'}));renderPosts()}
function setCategory(c,el){category=c;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(c==='전적')loadBattleData();else renderPosts()}
function normalizeGuideTitle(title){
 return String(title||'')
   .toLocaleLowerCase('ko-KR')
   .normalize('NFKC')
   .replace(/[\s\p{P}\p{S}]+/gu,'');
}
const expandedGuideGroups=new Set();
function toggleGuideGroup(key){
 if(expandedGuideGroups.has(key)) expandedGuideGroups.delete(key); else expandedGuideGroups.add(key);
 renderPosts();
}
function renderPostCard(p){
 const canEdit=member?.is_admin||String(p.author_id)===String(member?.id);
 const imgs=getImages(p);
 return `<div class="post"><span class="badge">${esc(p.category||p.cat||'공략')}</span><div class="title">${esc(p.title)}</div><div class="post-author">✍️ 작성자 · ${esc(p.author_nickname||'알 수 없음')}</div><div class="small">${new Date(p.created_at||Date.now()).toLocaleDateString('ko-KR')}</div><div class="post-body">${esc(p.content??p.body??'')}</div>${imgs.length?`<div class="image-grid">${imgs.map(u=>`<img src="${esc(u)}" loading="lazy">`).join('')}</div>`:''}<div class="post-actions">${canEdit?`<button class="iconbtn" onclick='editById(${JSON.stringify(String(p.id))})'>수정</button><button class="iconbtn" onclick='deletePost(${JSON.stringify(String(p.id))})'>삭제</button>`:''}<button type="button" class="iconbtn" onclick='event.stopPropagation();addSameTitleById(${JSON.stringify(String(p.id))})'>➕ 추가</button></div></div>`;
}
function renderPosts(){
 if(category==='홈'){
   $('welcome').textContent='불사 길드';
   renderHome();
   return;
 }
 const q=($('searchInput')?.value||'').trim().toLocaleLowerCase('ko-KR');
 const qNorm=normalizeGuideTitle(q);
 const a=posts.filter(p=>{
   const catOk=category==='전체'||(p.category||p.cat)===category;
   return catOk && (!qNorm || normalizeGuideTitle(p.title).includes(qNorm));
 });
 $('welcome').textContent=category==='전체'?'불사 공략실':category+' 공략';
 if(!a.length){$('postList').innerHTML=`<div class="card"><div class="small">${q?'검색 결과가 없습니다.':'등록된 공략이 없습니다.'}</div></div>`;return;}
 const groups=new Map();
 a.forEach(p=>{const key=normalizeGuideTitle(p.title);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p)});
 $('postList').innerHTML=[...groups.entries()].map(([key,group])=>{
   const first=group[0], open=expandedGuideGroups.has(key);
   const authors=[...new Set(group.map(p=>p.author_nickname||'알 수 없음'))];
   return `<div class="post" style="cursor:pointer" onclick='toggleGuideGroup(${JSON.stringify(key)})'><span class="badge">${esc(first.category||first.cat||'공략')}</span><div class="title">${esc(first.title)}</div><div class="post-author">✍️ ${group.length>1?`공략 ${group.length}개 · `:''}작성자 ${esc(authors.join(' · '))}</div><div class="small" style="margin-top:7px">${open?'▲ 눌러서 접기':'▼ 눌러서 공략 보기'}</div></div>${open?`<div style="padding-left:10px;border-left:2px solid #76200f">${group.map(renderPostCard).join('')}</div>`:''}`;
 }).join('');
}

function fmtDate(d){if(!d)return '-';const x=new Date(d+'T00:00:00');return `${x.getFullYear()}년 ${x.getMonth()+1}월 ${x.getDate()}일`}
function todayKST(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(new Date())}
function seasonStats(){
 const map={}; battleMembers.filter(m=>m.approved).forEach(m=>map[m.id]={member:m,wins:0,losses:0,defenses:0,attacks:0});
 battleRecords.forEach(r=>{if(!map[r.member_id])return;map[r.member_id].wins+=Number(r.wins||0);map[r.member_id].losses+=Number(r.losses||0);map[r.member_id].defenses+=Number(r.defenses||0);map[r.member_id].attacks+=Number(r.wins||0)+Number(r.losses||0)});
 return Object.values(map).map(x=>({...x,rate:x.attacks?x.wins/x.attacks:0}));
}
function attackRanking(stats){
 const maxAttacks=Math.max(0,...stats.map(x=>x.attacks));
 const eligible=maxAttacks?stats.filter(x=>x.attacks===maxAttacks):[];
 return eligible.sort((a,b)=>b.rate-a.rate||b.wins-a.wins||a.member.nickname.localeCompare(b.member.nickname,'ko'));
}
function defenseRanking(stats){return [...stats].sort((a,b)=>b.defenses-a.defenses||b.attacks-a.attacks||a.member.nickname.localeCompare(b.member.nickname,'ko')).filter(x=>x.defenses>0)}
async function loadBattleData(){
 const [{data:ms},{data:ss,error:se},{data:no}]=await Promise.all([sb.from('members').select('id,nickname,approved,is_admin'),sb.from('guild_seasons').select('*').order('start_date',{ascending:false}),sb.from('guild_notices').select('*').order('id',{ascending:true}).limit(1).maybeSingle()]);
 battleMembers=(ms||[]);noticeRow=no||null;if(se){console.error(se);return}
 activeSeason=(ss||[]).find(x=>x.is_active)||null;
 if(activeSeason){const {data:rs}=await sb.from('guild_battle_records').select('*').eq('season_id',activeSeason.id).order('battle_date',{ascending:false});battleRecords=rs||[]}else battleRecords=[];
 if(category==='전적')renderBattlePage();else if(category==='홈')renderHome();
}
function renderHome(){
 const stats=seasonStats(),atk=attackRanking(stats)[0],def=defenseRanking(stats)[0];
 const notice=noticeRow?.content||'등록된 공지가 없습니다.';
 $('postList').innerHTML=`<div class="card notice-home"><h2>📢 길드 공지</h2><div class="post-body">${esc(notice)}</div>${member?.is_admin?`<div style="height:10px"></div><button class="btn gold" onclick="editNotice()">공지 수정</button>`:''}</div><div class="battle-top"><div class="leaderbox"><b>⚔️ 이번 시즌 공격대장</b><div class="leader-name">${atk?'👑 '+esc(atk.member.nickname):'-'}</div><div class="small">${atk?`${atk.wins}승 ${atk.losses}패 · ${(atk.rate*100).toFixed(1)}% · ${atk.attacks}칼`:'기록 없음'}</div></div><div class="leaderbox"><b>🛡️ 이번 시즌 방어대장</b><div class="leader-name">${def?'👑 '+esc(def.member.nickname):'-'}</div><div class="small">${def?`${def.defenses}방어`:'기록 없음'}</div></div></div><img class="home-image" src="./home.png?v=1" alt="불사 길드 홍보 이미지">`;
}
async function editNotice(){if(!member?.is_admin)return;const content=prompt('홈 화면 공지 내용을 입력하세요.',noticeRow?.content||'');if(content===null)return;let res;if(noticeRow?.id)res=await sb.from('guild_notices').update({content,updated_at:new Date().toISOString(),updated_by:member.id}).eq('id',noticeRow.id);else res=await sb.from('guild_notices').insert({content,updated_by:member.id});if(res.error)return alert('공지 저장 오류: '+res.error.message);await loadBattleData()}
function renderBattlePage(){
 $('welcome').textContent='길드전 시즌 전적';
 const stats=seasonStats(),atk=attackRanking(stats).slice(0,3),def=defenseRanking(stats).slice(0,3),today=todayKST();
 const todaySet=new Set(battleRecords.filter(r=>r.battle_date===today).map(r=>String(r.member_id)));
 const approved=battleMembers.filter(m=>m.approved&&!m.is_admin || (m.approved&&m.is_admin));
 const rank=(arr,type)=>arr.length?arr.map((x,i)=>`<div class="rankline">${['🥇','🥈','🥉'][i]} ${esc(x.member.nickname)} · ${type==='a'?`${(x.rate*100).toFixed(1)}% (${x.wins}승 ${x.losses}패 / ${x.attacks}칼)`:x.defenses+'방어'}</div>`).join(''):'<div class="small">아직 기록이 없습니다.</div>';
 const rows=stats.sort((a,b)=>b.attacks-a.attacks||b.rate-a.rate).map(x=>`<div class="battle-row"><div class="battle-row-head"><strong class="${todaySet.has(String(x.member.id))?'':'missing-name'}">${esc(x.member.nickname)}${todaySet.has(String(x.member.id))?'':' · 오늘 미입력'}</strong>${(String(x.member.id)===String(member.id)||member?.is_admin)?`<button class="mini-btn" onclick="openBattleEditor('${x.member.id}')">오늘 입력</button>`:''}</div><div class="battle-stats">⚔️ ${x.wins}승 ${x.losses}패 · 승률 ${(x.rate*100).toFixed(1)}% · 총 ${x.attacks}칼<br>🛡️ ${x.defenses}방어</div></div>`).join('');
 $('postList').innerHTML=`<div class="season-title">📅 ${activeSeason?fmtDate(activeSeason.start_date)+' ~ '+(activeSeason.end_date?fmtDate(activeSeason.end_date):'진행중'):'진행중인 시즌 없음'}</div><div class="battle-top"><div class="leaderbox"><b>⚔️ 공격대장 TOP 3</b>${rank(atk,'a')}</div><div class="leaderbox"><b>🛡️ 방어대장 TOP 3</b>${rank(def,'d')}</div></div><div class="card"><b>🔥 오늘 기록 현황</b><div class="small" style="margin-top:5px">${todaySet.size} / ${approved.length}명 입력 완료 · 미입력자는 빨간색</div></div>${rows}${member?.is_admin?`<div class="admin-tools"><b>🔐 관리자 기능</b><div style="height:8px"></div><button class="btn secondary" onclick="openAdminBattleEntry()">닉네임으로 대신 입력</button><div style="height:8px"></div><button class="btn gold" onclick="showPastSeasons()">지난 시즌 기록</button><div style="height:8px"></div><button class="btn" onclick="endSeason()">🏁 현재 시즌 종료 / 새 시즌 시작</button></div>`:`<button class="btn secondary" onclick="showPastSeasons()">지난 시즌 기록</button>`}`;
}
function openBattleEditor(memberId){
 if(!activeSeason)return alert('진행중인 시즌이 없습니다.');const m=battleMembers.find(x=>String(x.id)===String(memberId));if(!m)return;const today=todayKST();const r=battleRecords.find(x=>String(x.member_id)===String(memberId)&&x.battle_date===today);
 $('modalBox').innerHTML=`<h2>⚔️ 오늘 전적 · ${esc(m.nickname)}</h2><div class="small">${today} · 공격은 하루 최대 5칼입니다. 방어 횟수는 제한이 없습니다.</div><label for="bWins" style="display:block;font-size:16px;font-weight:1000;color:#fff;margin:16px 0 2px">⚔️ 승리</label><input id="bWins" type="number" min="0" max="5" inputmode="numeric" aria-label="승리" placeholder="⚔️ 승리 횟수" value="${r?.wins??0}" oninput="updateAttackCount()"><label for="bLosses" style="display:block;font-size:16px;font-weight:1000;color:#fff;margin:8px 0 2px">💥 패배</label><input id="bLosses" type="number" min="0" max="5" inputmode="numeric" aria-label="패배" placeholder="💥 패배 횟수" value="${r?.losses??0}" oninput="updateAttackCount()"><div id="attackCount" class="notice" style="margin:0 0 12px">⚔️ 오늘 사용 칼 ${(r?.wins??0)+(r?.losses??0)} / 5</div><label for="bDefs" style="display:block;font-size:16px;font-weight:1000;color:#fff;margin:8px 0 2px">🛡️ 방어 성공 <span style="font-size:12px;color:#aaa">(제한 없음)</span></label><input id="bDefs" type="number" min="0" inputmode="numeric" aria-label="방어 성공" placeholder="🛡️ 방어 성공 횟수 (제한 없음)" value="${r?.defenses??0}"><button class="btn" onclick="saveBattleRecord('${m.id}')">저장</button><div style="height:8px"></div><button class="btn secondary" onclick="closeModal()">취소</button>`;$('modal').classList.remove('hidden');
}
function updateAttackCount(){const w=Number($('bWins')?.value||0),l=Number($('bLosses')?.value||0);const el=$('attackCount');if(el){el.textContent=`⚔️ 오늘 사용 칼 ${w+l} / 5`;el.style.borderColor=(w+l)>5?'#e52525':'#674514';}} async function saveBattleRecord(memberId){const wins=Number($('bWins').value||0),losses=Number($('bLosses').value||0),defenses=Number($('bDefs').value||0);if(wins<0||losses<0||defenses<0||wins+losses>5)return alert('공격 승+패 합계는 최대 5입니다.');if(!member?.is_admin&&String(memberId)!==String(member.id))return alert('본인 기록만 입력할 수 있습니다.');const payload={season_id:activeSeason.id,member_id:memberId,battle_date:todayKST(),wins,losses,defenses,updated_at:new Date().toISOString()};const {error}=await sb.from('guild_battle_records').upsert(payload,{onConflict:'season_id,member_id,battle_date'});if(error)return alert('저장 오류: '+error.message);closeModal();await loadBattleData()}
function openAdminBattleEntry(){const opts=battleMembers.filter(m=>m.approved).map(m=>`<option value="${m.id}">${esc(m.nickname)}</option>`).join('');$('modalBox').innerHTML=`<h2>관리자 대리 입력</h2><select id="adminBattleMember">${opts}</select><button class="btn" onclick="adminPickBattleMember()">선택</button><div style="height:8px"></div><button class="btn secondary" onclick="closeModal()">취소</button>`;$('modal').classList.remove('hidden')}
function adminPickBattleMember(){const id=$('adminBattleMember').value;closeModal();openBattleEditor(id)}
async function endSeason(){if(!member?.is_admin||!activeSeason)return;if(!confirm('현재 시즌을 종료하고 오늘부터 새 시즌을 시작할까요?\n지난 시즌 기록은 그대로 보관됩니다.'))return;const today=todayKST();let {error}=await sb.from('guild_seasons').update({is_active:false,end_date:today}).eq('id',activeSeason.id);if(error)return alert('시즌 종료 오류: '+error.message);({error}=await sb.from('guild_seasons').insert({start_date:today,is_active:true}));if(error)return alert('새 시즌 생성 오류: '+error.message);await loadBattleData();alert('새 시즌이 시작되었습니다.')}
async function showPastSeasons(){const {data,error}=await sb.from('guild_seasons').select('*').eq('is_active',false).order('start_date',{ascending:false});if(error)return alert(error.message);$('modalBox').innerHTML=`<h2>📚 지난 시즌 기록</h2>${(data||[]).map(s=>`<button class="btn secondary" style="margin-bottom:8px" onclick="openPastSeason(${s.id})">${fmtDate(s.start_date)} ~ ${fmtDate(s.end_date)}</button>`).join('')||'<div class="small">지난 시즌이 없습니다.</div>'}<button class="btn secondary" onclick="closeModal()">닫기</button>`;$('modal').classList.remove('hidden')}
async function openPastSeason(id){const [{data:s},{data:rs}]=await Promise.all([sb.from('guild_seasons').select('*').eq('id',id).single(),sb.from('guild_battle_records').select('*').eq('season_id',id)]);const old=battleRecords,oldSeason=activeSeason;battleRecords=rs||[];activeSeason=s;const stats=seasonStats(),atk=attackRanking(stats).slice(0,3),def=defenseRanking(stats).slice(0,3);const lines=stats.sort((a,b)=>b.attacks-a.attacks||b.rate-a.rate).map(x=>`<div class="battle-row"><strong>${esc(x.member.nickname)}</strong><div class="battle-stats">⚔️ ${x.wins}승 ${x.losses}패 · ${(x.rate*100).toFixed(1)}% · ${x.attacks}칼<br>🛡️ ${x.defenses}방어</div></div>`).join('');$('modalBox').innerHTML=`<h2>📅 ${fmtDate(s.start_date)} ~ ${fmtDate(s.end_date)}</h2><div class="leaderbox"><b>⚔️ 공격 TOP3</b>${atk.map((x,i)=>`<div class="rankline">${i+1}위 ${esc(x.member.nickname)} · ${(x.rate*100).toFixed(1)}%</div>`).join('')||'기록 없음'}</div><div style="height:8px"></div><div class="leaderbox"><b>🛡️ 방어 TOP3</b>${def.map((x,i)=>`<div class="rankline">${i+1}위 ${esc(x.member.nickname)} · ${x.defenses}방어</div>`).join('')||'기록 없음'}</div>${lines}<button class="btn secondary" onclick="closeModal()">닫기</button>`;battleRecords=old;activeSeason=oldSeason}

function getImages(p){
 if(Array.isArray(p.image_urls)) return p.image_urls.filter(Boolean);
 if(typeof p.image_urls==='string'){try{const a=JSON.parse(p.image_urls);if(Array.isArray(a))return a.filter(Boolean)}catch(e){}}
 if(typeof p.image_url==='string' && p.image_url.trim().startsWith('[')){try{const a=JSON.parse(p.image_url);if(Array.isArray(a))return a.filter(Boolean)}catch(e){}}
 return p.image_url?[p.image_url]:[];
}
function addSameTitleById(id){
  const p=posts.find(x=>String(x.id)===String(id));
  if(!p){alert('공략 정보를 찾지 못했습니다. 새로고침 후 다시 눌러주세요.');return;}
  openPostEditor(null,{category:p.category||p.cat||'길드전',title:p.title||''});
}

function openPostEditor(p=null,preset=null){
 $('modalBox').innerHTML=`<h2>${p?'공략 수정':'공략 작성'}</h2><select id="pCat"><option>길드전</option><option>공성전</option><option>파괴신</option></select><input id="pTitle" placeholder="제목" value="${esc(p?.title||preset?.title||'')}"><textarea id="pBody" placeholder="공략 내용">${esc(p?.content??p?.body??'')}</textarea><label class="upload-label" for="pImages">📷 사진 선택 (여러 장 가능)</label><input id="pImages" type="file" accept="image/*" multiple style="display:none" onchange="showFileCount()"><div id="fileCount" class="upload-note">${p&&getImages(p).length?'기존 사진 '+getImages(p).length+'장 · 새 사진을 선택하면 추가됩니다.':'선택된 사진 없음'}</div><button class="btn" onclick="savePost('${p?.id||''}')">저장</button><div style="height:8px"></div><button class="btn secondary" onclick="closeModal()">취소</button>`;
 $('modal').classList.remove('hidden');
 if(p){
  $('pCat').value=(p.category||p.cat)==='강림'?'공성전':(p.category||p.cat||'길드전');
}else if(preset){
  $('pCat').value=(preset.category==='강림'?'공성전':preset.category||'길드전');
}else if(category==='길드전'||category==='공성전'||category==='파괴신'){
  $('pCat').value=category;
}
}
function showFileCount(){const n=$('pImages').files.length;$('fileCount').textContent=n?`${n}장 선택됨`:'선택된 사진 없음'}
async function uploadImages(files){
 const urls=[];
 for(const file of files){
   const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
   const path=`${member.id}/${Date.now()}-${crypto.randomUUID()}.${ext}`;
   const {error}=await sb.storage.from('guide-images').upload(path,file,{upsert:false,contentType:file.type||undefined});
   if(error)throw error;
   const {data}=sb.storage.from('guide-images').getPublicUrl(path);
   urls.push(data.publicUrl);
 }
 return urls;
}
async function savePost(id){
 if(!member?.approved)return alert('승인된 길드원만 작성할 수 있습니다.');
 const title=$('pTitle').value.trim(),content=$('pBody').value.trim();
 if(!title)return alert('제목을 입력하세요.');
 const old=id?posts.find(x=>String(x.id)===String(id)):null;
 if(id && !member.is_admin && String(old?.author_id)!==String(member.id))return alert('자기가 작성한 공략만 수정할 수 있습니다.');
 const btn=document.querySelector('#modalBox .btn'); if(btn){btn.disabled=true;btn.textContent='저장 중...'}
 try{
   const newUrls=await uploadImages(Array.from($('pImages').files||[]));
   const allUrls=[...getImages(old||{}),...newUrls];
   const payload={category:$('pCat').value,title,content,author_id:old?.author_id||member.id,updated_at:new Date().toISOString()};
   // Current DB has image_url; multiple URLs are stored as JSON text there for compatibility.
   payload.image_url=allUrls.length?JSON.stringify(allUrls):null;
   let res=id?await sb.from('guides').update(payload).eq('id',id):await sb.from('guides').insert(payload);
   if(res.error)throw res.error;
   closeModal();await loadPosts();if(!$('adminView').classList.contains('hidden'))await renderAdmin();
 }catch(e){alert('저장 오류: '+(e?.message||e))}
 finally{if(btn){btn.disabled=false;btn.textContent='저장'}}
}


function openMyPage(){
 if(!member)return;
 $('modalBox').innerHTML=`<h2>👤 마이페이지</h2>
 <div class="card" style="margin-top:12px">
   <div class="small">현재 표시 닉네임</div>
   <div style="font-size:22px;font-weight:1000;margin-top:5px">${esc(member.nickname||'')}</div>
 </div>
 <button class="btn" onclick="openNicknameEditor()">✏️ 닉네임 변경</button>
 <div style="height:8px"></div>
 <button class="btn secondary" onclick="closeModal()">닫기</button>`;
 $('modal').classList.remove('hidden');
}
function openNicknameEditor(targetId=null){
 const target=targetId?battleMembers.find(x=>String(x.id)===String(targetId)):member;
 if(!target)return;
 if(targetId&&!member?.is_admin)return alert('관리자만 다른 길드원의 닉네임을 변경할 수 있습니다.');
 $('modalBox').innerHTML=`<h2>✏️ 닉네임 변경</h2><div class="small">사이트에 표시되는 닉네임만 변경됩니다.<br>로그인할 때 사용하는 기존 닉네임은 그대로입니다.</div><input id="newNickname" maxlength="30" placeholder="새 표시 닉네임" value="${esc(target.nickname||'')}"><button class="btn" onclick="saveNickname('${target.id}')">변경 저장</button><div style="height:8px"></div><button class="btn secondary" onclick="closeModal()">취소</button>`;
 $('modal').classList.remove('hidden');
}
async function saveNickname(targetId){
 const nickname=$('newNickname').value.trim();
 if(!nickname)return alert('새 닉네임을 입력해주세요.');
 if(nickname.length>30)return alert('닉네임은 30자 이하로 입력해주세요.');
 if(String(targetId)!==String(member?.id)&&!member?.is_admin)return alert('본인 닉네임만 변경할 수 있습니다.');
 const {error}=await sb.from('members').update({nickname}).eq('id',targetId);
 if(error)return alert('닉네임 변경 오류: '+error.message);
 if(String(targetId)===String(member.id)){member.nickname=nickname;$('who').textContent=nickname+'님 환영합니다.';}
 closeModal();await loadPosts();await loadBattleData();
 if(!$('adminView').classList.contains('hidden'))await renderAdmin();
 alert('표시 닉네임이 변경되었습니다.\n로그인할 때는 기존 닉네임을 사용해주세요.');
}
async function openAdmin(){if(!member?.is_admin)return alert('관리자만 들어갈 수 있습니다.');show('adminView');await renderAdmin()}
function backApp(){show('appView')}
async function renderAdmin(){const {data:ms,error}=await sb.from('members').select('*').order('approved',{ascending:true});if(error){$('members').innerHTML='<div class="small">'+esc(error.message)+'</div>';return}$('members').innerHTML=(ms||[]).map(m=>`<div class="member"><div><strong>${esc(m.nickname)} ${m.is_admin?'👑':''}</strong><span>${m.approved?(m.is_admin?'관리자':'승인된 길드원'):'승인 대기'}</span></div><div class="row">${m.approved?`<button class="iconbtn" onclick="openNicknameEditor(\'${m.id}\')">닉네임</button>`:''}${!m.approved?`<button class="iconbtn" onclick="approveMember('${m.id}')">승인</button>`:''}${m.id!==member.id?`<button class="iconbtn" onclick="kickMember('${m.id}','${esc(m.nickname)}')">추방</button>`:''}</div></div>`).join('')||'<div class="small">회원이 없습니다.</div>';$('adminPosts').innerHTML=posts.map(p=>`<div class="member"><div><strong>${esc(p.title)}</strong><span>${esc(p.category||p.cat||'공략')}</span></div><div class="row"><button class="iconbtn" onclick='editById(${JSON.stringify(String(p.id))})'>수정</button><button class="iconbtn" onclick='deletePost(${JSON.stringify(String(p.id))})'>삭제</button></div></div>`).join('')||'<div class="small">공략이 없습니다.</div>'}
async function approveMember(id){const {error}=await sb.from('members').update({approved:true}).eq('id',id);if(error)return alert(error.message);await renderAdmin()}
async function kickMember(id,nick){if(!confirm(nick+' 님을 추방할까요?'))return;const {error}=await sb.from('members').delete().eq('id',id);if(error)return alert(error.message);await renderAdmin()}
function editById(id){const p=posts.find(x=>String(x.id)===String(id));if(p)openPostEditor(p)}
async function deletePost(id){const p=posts.find(x=>String(x.id)===String(id));if(!member?.is_admin&&String(p?.author_id)!==String(member?.id))return alert('자기가 작성한 공략만 삭제할 수 있습니다.');if(!confirm('이 공략을 삭제할까요?'))return;const {error}=await sb.from('guides').delete().eq('id',id);if(error)return alert(error.message);await loadPosts();await renderAdmin()}
function closeModal(){$('modal').classList.add('hidden')}$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session?.user)await enterWithUser(session.user)})();
</script></body></html>
