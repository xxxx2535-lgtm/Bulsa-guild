<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>불사 공략실</title>
<style>
:root{--red:#e52525;--gold:#ffc83d;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#3a0905 0,#100605 32%,#070707 75%);color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}.hidden{display:none!important}.wrap{max-width:520px;margin:auto;min-height:100vh;padding:18px 14px 36px}.logo{text-align:center;font-weight:1000;font-size:48px;letter-spacing:-5px;text-shadow:0 0 15px #ff2a00,2px 3px 0 #6d0900;margin:8px 0 2px}.sub{text-align:center;color:#ffd38a;font-weight:700;margin-bottom:24px}.card{background:linear-gradient(145deg,#1d1d1d,#101010);border:1px solid #3a3a3a;border-radius:18px;padding:18px;box-shadow:0 8px 30px #0008;margin-bottom:14px}.hero{border-color:#76200f;background:linear-gradient(145deg,#32100b,#121212)}h2{margin:0 0 12px;font-size:21px}.small{font-size:13px;color:var(--muted)}input,textarea,select{width:100%;background:#090909;border:1px solid #454545;border-radius:12px;color:#fff;padding:13px;margin:6px 0 10px;outline:none}textarea{min-height:180px;resize:vertical}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--red),#a80d0d);width:100%;cursor:pointer}.btn.secondary{background:#2b2b2b}.btn.gold{background:linear-gradient(135deg,#ffbd22,#d66d00);color:#1b0c00}.tabs{display:flex;gap:8px;overflow:auto;margin:10px 0 15px}.tab{white-space:nowrap;border:1px solid #444;background:#171717;color:#bbb;border-radius:999px;padding:9px 13px;font-weight:800}.tab.active{background:#d91c1c;color:#fff}.post{padding:15px;border-radius:14px;background:#171717;border:1px solid #333;margin:9px 0}.post .title{font-size:17px;font-weight:900}.badge{display:inline-block;background:#65100d;color:#ffb2a5;border:1px solid #8d2920;border-radius:999px;padding:3px 8px;font-size:11px;margin-bottom:7px}.post-body{white-space:pre-wrap;line-height:1.65;color:#ddd;margin-top:12px}.post-img{max-width:100%;border-radius:12px;margin-top:10px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.iconbtn{background:#171717;color:#fff;border:1px solid #444;border-radius:10px;padding:8px 11px}.notice{padding:12px;border-radius:12px;background:#24170a;border:1px solid #674514;color:#ffd98a;font-size:13px;line-height:1.5}.member{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#171717;border:1px solid #333;padding:12px;border-radius:12px;margin:7px 0}.member strong{display:block}.member span{font-size:12px;color:#aaa}.row{display:flex;gap:7px}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:10}.modalbox{width:min(520px,100%);max-height:90vh;overflow:auto;background:#151515;border:1px solid #444;border-radius:20px;padding:18px}.footer{text-align:center;color:#666;font-size:11px;margin-top:25px}
.searchbox{position:relative;margin:0 0 12px}.searchbox input{padding-left:40px;margin:0}.searchicon{position:absolute;left:14px;top:13px;color:#aaa}.post-actions{display:flex;gap:7px;margin-top:12px}.post-actions button{flex:1}.image-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.image-grid img{width:100%;height:150px;object-fit:cover;border-radius:12px}.upload-label{display:block;border:1px dashed #666;border-radius:12px;padding:14px;text-align:center;margin:6px 0 10px;background:#111;font-weight:800;cursor:pointer}.upload-note{font-size:12px;color:#aaa;margin:-4px 0 10px}
</style>
</head><body><div class="wrap">
<section id="loginView"><div class="logo">불사</div><div class="sub">🔥 불사 길드 전용 공략실</div><div class="card hero"><h2>길드원 전용 입장</h2><div class="small">가입한 이메일과 비밀번호를 입력하세요.</div><input id="loginEmail" type="email" placeholder="이메일"><input id="loginPass" type="password" placeholder="비밀번호"><button class="btn" onclick="login()">입장하기</button><div style="height:8px"></div><button class="btn secondary" onclick="showRegister()">처음 오셨나요? 가입 신청</button><div id="loginMsg" class="small" style="margin-top:10px;color:#ff8f80"></div></div><div class="notice">🔒 비밀번호는 이 화면이나 소스코드에 저장되지 않습니다.</div></section>
<section id="appView" class="hidden"><div class="topbar"><div><b>🔥 불사 공략실</b><div class="small" id="who"></div></div><button class="iconbtn" onclick="logout()">로그아웃</button></div><div class="searchbox"><span class="searchicon">🔎</span><input id="searchInput" placeholder="제목·내용 검색 (단어 일부만 입력해도 됩니다)" oninput="renderPosts()"></div><div class="tabs"><button class="tab active" onclick="setCategory('전체',this)">전체</button><button class="tab" onclick="setCategory('길드전',this)">⚔️ 길드전</button><button class="tab" onclick="setCategory('공성전',this)">🏰 공성전</button><button class="tab" onclick="setCategory('파괴신',this)">💀 파괴신</button></div><div class="card hero"><h2 id="welcome">불사 공략실</h2><div class="small">승인된 길드원은 누구나 공략을 작성할 수 있습니다.</div></div><div id="postList"></div><div id="writeArea"><button class="btn" onclick="openPostEditor()">✍️ 공략 작성</button><div id="adminBtn" class="hidden" style="height:8px"></div><button id="adminButton" class="btn gold hidden" onclick="openAdmin()">🔐 관리자 페이지</button></div><div class="footer">불사 길드</div></section>
<section id="adminView" class="hidden"><div class="topbar"><div><b>🔐 관리자 페이지</b><div class="small">가입 승인 · 추방 · 공략 관리</div></div><button class="iconbtn" onclick="backApp()">돌아가기</button></div><div class="card"><h2>가입 신청 / 길드원 관리</h2><div id="members"></div></div><div class="card"><h2>공략 관리</h2><div id="adminPosts"></div></div></section>
</div><div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ltvpxypdxtaxfnivmgni.supabase.co';
const SUPABASE_KEY='sb_publishable_AKTOoPDYpcvX2qUfiYoH0Q_dNS4t9Sc';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let member=null,posts=[],category='전체';
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function show(id){['loginView','appView','adminView'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}
async function login(){ $('loginMsg').textContent='로그인 중...'; const email=$('loginEmail').value.trim(),password=$('loginPass').value; const {data,error}=await sb.auth.signInWithPassword({email,password}); if(error){$('loginMsg').textContent='로그인 실패: 이메일 또는 비밀번호를 확인해주세요.';return} await enterWithUser(data.user); }
async function enterWithUser(user){ const {data:m,error}=await sb.from('members').select('*').eq('id',user.id).maybeSingle(); if(error){$('loginMsg').textContent='회원정보 확인 오류: '+error.message;return} if(!m){await sb.auth.signOut();$('loginMsg').textContent='가입 신청 정보가 없습니다.';return} if(!m.approved){await sb.auth.signOut();$('loginMsg').textContent='아직 관리자 승인을 기다리는 중입니다.';return} member=m; $('who').textContent=(m.nickname||user.email)+'님 환영합니다.'; show('appView'); $('writeArea').classList.remove('hidden'); $('adminButton').classList.toggle('hidden',!m.is_admin); $('adminBtn').classList.toggle('hidden',!m.is_admin); await loadPosts(); }
async function logout(){await sb.auth.signOut();member=null;show('loginView')}
function showRegister(){ $('modalBox').innerHTML=`<h2>가입 신청</h2><div class="small">이메일/비밀번호로 계정을 만들고 관리자 승인을 기다려주세요.</div><input id="regNick" placeholder="게임 닉네임"><input id="regEmail" type="email" placeholder="이메일"><input id="regPass" type="password" placeholder="비밀번호 (6자 이상)"><button class="btn" onclick="register()">가입 신청</button><div style="height:8px"></div><button class="btn secondary" onclick="closeModal()">닫기</button>`;$('modal').classList.remove('hidden')}
async function register(){const nickname=$('regNick').value.trim(),email=$('regEmail').value.trim(),password=$('regPass').value;if(!nickname||!email||password.length<6)return alert('닉네임, 이메일, 6자 이상 비밀번호를 입력해주세요.');const {data,error}=await sb.auth.signUp({email,password,options:{data:{nickname}}});if(error)return alert('가입 실패: '+error.message);closeModal();alert('가입 신청 완료! 관리자 승인을 기다려주세요.');await sb.auth.signOut()}
async function loadPosts(){const {data,error}=await sb.from('guides').select('*').order('created_at',{ascending:false});if(error){$('postList').innerHTML=`<div class="card"><div class="small">공략 불러오기 오류: ${esc(error.message)}</div></div>`;return}posts=data||[];renderPosts()}
function setCategory(c,el){category=c;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderPosts()}
function renderPosts(){
 const q=($('searchInput')?.value||'').trim().toLocaleLowerCase('ko-KR');
 const terms=q.split(/\s+/).filter(Boolean);
 const a=posts.filter(p=>{
   const catOk=category==='전체'||(p.category||p.cat)===category;
   const hay=((p.title||'')+' '+(p.content??p.body??'')).toLocaleLowerCase('ko-KR');
   return catOk && terms.every(t=>hay.includes(t));
 });
 $('welcome').textContent=category==='전체'?'불사 공략실':category+' 공략';
 $('postList').innerHTML=a.length?a.map(p=>{
   const canEdit=member?.is_admin||String(p.author_id)===String(member?.id);
   const imgs=getImages(p);
   return `<div class="post"><span class="badge">${esc(p.category||p.cat||'공략')}</span><div class="title">${esc(p.title)}</div><div class="small">${new Date(p.created_at||Date.now()).toLocaleDateString('ko-KR')}</div><div class="post-body">${esc(p.content??p.body??'')}</div>${imgs.length?`<div class="image-grid">${imgs.map(u=>`<img src="${esc(u)}" loading="lazy">`).join('')}</div>`:''}${canEdit?`<div class="post-actions"><button class="iconbtn" onclick='editById(${JSON.stringify(String(p.id))})'>수정</button><button class="iconbtn" onclick='deletePost(${JSON.stringify(String(p.id))})'>삭제</button></div>`:''}</div>`;
 }).join(''):`<div class="card"><div class="small">${q?'검색 결과가 없습니다.':'등록된 공략이 없습니다.'}</div></div>`;
}
function getImages(p){
 if(Array.isArray(p.image_urls)) return p.image_urls.filter(Boolean);
 if(typeof p.image_urls==='string'){try{const a=JSON.parse(p.image_urls);if(Array.isArray(a))return a.filter(Boolean)}catch(e){}}
 if(typeof p.image_url==='string' && p.image_url.trim().startsWith('[')){try{const a=JSON.parse(p.image_url);if(Array.isArray(a))return a.filter(Boolean)}catch(e){}}
 return p.image_url?[p.image_url]:[];
}
function openPostEditor(p=null){
 $('modalBox').innerHTML=`<h2>${p?'공략 수정':'공략 작성'}</h2><select id="pCat"><option>길드전</option><option>공성전</option><option>파괴신</option></select><input id="pTitle" placeholder="제목" value="${esc(p?.title||'')}"><textarea id="pBody" placeholder="공략 내용">${esc(p?.content??p?.body??'')}</textarea><label class="upload-label" for="pImages">📷 사진 선택 (여러 장 가능)</label><input id="pImages" type="file" accept="image/*" multiple style="display:none" onchange="showFileCount()"><div id="fileCount" class="upload-note">${p&&getImages(p).length?'기존 사진 '+getImages(p).length+'장 · 새 사진을 선택하면 추가됩니다.':'선택된 사진 없음'}</div><button class="btn" onclick="savePost('${p?.id||''}')">저장</button><div style="height:8px"></div><button class="btn secondary" onclick="closeModal()">취소</button>`;
 $('modal').classList.remove('hidden');
 if(p)$('pCat').value=(p.category||p.cat)==='강림'?'공성전':(p.category||p.cat||'길드전');
}
function showFileCount(){const n=$('pImages').files.length;$('fileCount').textContent=n?`${n}장 선택됨`:'선택된 사진 없음'}
async function uploadImages(files){
 const urls=[];
 for(const file of files){
   const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
   const path=`${member.id}/${Date.now()}-${crypto.randomUUID()}.${ext}`;
   const {error}=await sb.storage.from('guide-images').upload(path,file,{upsert:false,contentType:file.type||undefined});
   if(error)throw error;
   const {data}=sb.storage.from('guide-images').getPublicUrl(path);
   urls.push(data.publicUrl);
 }
 return urls;
}
async function savePost(id){
 if(!member?.approved)return alert('승인된 길드원만 작성할 수 있습니다.');
 const title=$('pTitle').value.trim(),content=$('pBody').value.trim();
 if(!title)return alert('제목을 입력하세요.');
 const old=id?posts.find(x=>String(x.id)===String(id)):null;
 if(id && !member.is_admin && String(old?.author_id)!==String(member.id))return alert('자기가 작성한 공략만 수정할 수 있습니다.');
 const btn=document.querySelector('#modalBox .btn'); if(btn){btn.disabled=true;btn.textContent='저장 중...'}
 try{
   const newUrls=await uploadImages(Array.from($('pImages').files||[]));
   const allUrls=[...getImages(old||{}),...newUrls];
   const payload={category:$('pCat').value,title,content,author_id:old?.author_id||member.id,updated_at:new Date().toISOString()};
   // Current DB has image_url; multiple URLs are stored as JSON text there for compatibility.
   payload.image_url=allUrls.length?JSON.stringify(allUrls):null;
   let res=id?await sb.from('guides').update(payload).eq('id',id):await sb.from('guides').insert(payload);
   if(res.error)throw res.error;
   closeModal();await loadPosts();if(!$('adminView').classList.contains('hidden'))await renderAdmin();
 }catch(e){alert('저장 오류: '+(e?.message||e))}
 finally{if(btn){btn.disabled=false;btn.textContent='저장'}}
}
async function openAdmin(){if(!member?.is_admin)return alert('관리자만 들어갈 수 있습니다.');show('adminView');await renderAdmin()}
function backApp(){show('appView')}
async function renderAdmin(){const {data:ms,error}=await sb.from('members').select('*').order('approved',{ascending:true});if(error){$('members').innerHTML='<div class="small">'+esc(error.message)+'</div>';return}$('members').innerHTML=(ms||[]).map(m=>`<div class="member"><div><strong>${esc(m.nickname)} ${m.is_admin?'👑':''}</strong><span>${m.approved?(m.is_admin?'관리자':'승인된 길드원'):'승인 대기'}</span></div><div class="row">${!m.approved?`<button class="iconbtn" onclick="approveMember('${m.id}')">승인</button>`:''}${m.id!==member.id?`<button class="iconbtn" onclick="kickMember('${m.id}','${esc(m.nickname)}')">추방</button>`:''}</div></div>`).join('')||'<div class="small">회원이 없습니다.</div>';$('adminPosts').innerHTML=posts.map(p=>`<div class="member"><div><strong>${esc(p.title)}</strong><span>${esc(p.category||p.cat||'공략')}</span></div><div class="row"><button class="iconbtn" onclick='editById(${JSON.stringify(String(p.id))})'>수정</button><button class="iconbtn" onclick='deletePost(${JSON.stringify(String(p.id))})'>삭제</button></div></div>`).join('')||'<div class="small">공략이 없습니다.</div>'}
async function approveMember(id){const {error}=await sb.from('members').update({approved:true}).eq('id',id);if(error)return alert(error.message);await renderAdmin()}
async function kickMember(id,nick){if(!confirm(nick+' 님을 추방할까요?'))return;const {error}=await sb.from('members').delete().eq('id',id);if(error)return alert(error.message);await renderAdmin()}
function editById(id){const p=posts.find(x=>String(x.id)===String(id));if(p)openPostEditor(p)}
async function deletePost(id){const p=posts.find(x=>String(x.id)===String(id));if(!member?.is_admin&&String(p?.author_id)!==String(member?.id))return alert('자기가 작성한 공략만 삭제할 수 있습니다.');if(!confirm('이 공략을 삭제할까요?'))return;const {error}=await sb.from('guides').delete().eq('id',id);if(error)return alert(error.message);await loadPosts();await renderAdmin()}
function closeModal(){$('modal').classList.add('hidden')}$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session?.user)await enterWithUser(session.user)})();
</script></body></html>
