async function login(){ $('loginMsg').textContent='로그인 중...'; const nickname=$('loginEmail').value.trim(),password=$('loginPass').value; if(!nickname||!password){$('loginMsg').textContent='닉네임과 비밀번호를 입력해주세요.';return} const email=nickEmail(nickname); const {data,error}=await sb.auth.signInWithPassword({email,password}); if(error){$('loginMsg').textContent='로그인 실패: 닉네임 또는 비밀번호를 확인해주세요.';return} await enterWithUser(data.user); }

async function loadPosts(){const [{data,error},{data:memberRows},{data:commentRows}]=await Promise.all([sb.from('guides').select('*').order('created_at',{ascending:false}),sb.from('members').select('id,nickname'),sb.from('guide_comments').select('guide_id')]);if(error){$('postList').innerHTML=`<div class="card"><div class="small">공략 불러오기 오류: ${esc(error.message)}</div></div>`;return}const nicknameById=Object.fromEntries((memberRows||[]).map(m=>[String(m.id),m.nickname]));commentCounts={};(commentRows||[]).forEach(c=>commentCounts[String(c.guide_id)]=(commentCounts[String(c.guide_id)]||0)+1);posts=(data||[]).map(p=>({...p,author_nickname:nicknameById[String(p.author_id)]||'알 수 없음'}));renderPosts()}
function setCategory(c,el){selectedCharacters.clear();category=c;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderPosts()}
function normalizeGuideTitle(title){
 return String(title||'')
   .toLocaleLowerCase('ko-KR')
   .normalize('NFKC')
   .replace(/[\s\p{P}\p{S}]+/gu,'');
}
const categoryDescriptionsDefault='승인된 길드원은 누구나 공략을 작성할 수 있습니다.';
let categoryDescriptions={};
const selectedCharacters=new Set();
async function loadCategoryDescriptions(){
 const {data,error}=await sb.from('guild_category_descriptions').select('category,content');
 if(error){console.warn('카테고리 안내문 로드 실패:',error.message);return;}
 categoryDescriptions=Object.fromEntries((data||[]).map(r=>[r.category,r.content]));
 renderPosts();
}
function editCategoryDescription(){
 if(!member?.is_admin||category==='홈')return;
 const current=categoryDescriptions[category]??categoryDescriptionsDefault;
 $('modalBox').innerHTML=`<h2>✏️ ${esc(category)} 안내 문구 수정</h2><textarea id="categoryDescInput" maxlength="1000" style="min-height:130px">${esc(current)}</textarea><button class="btn" onclick="saveCategoryDescription()">저장</button><div style="height:8px"></div><button class="btn secondary" onclick="closeModal()">취소</button>`;
 $('modal').classList.remove('hidden');
}
async function saveCategoryDescription(){
 if(!member?.is_admin||category==='홈')return;
 const content=$('categoryDescInput').value.trim();
 const {error}=await sb.from('guild_category_descriptions').upsert({category,content},{onConflict:'category'});
 if(error)return alert('안내 문구 저장 오류: '+error.message+'\nSQL 설정을 먼저 완료했는지 확인해주세요.');
 categoryDescriptions[category]=content;
 closeModal();renderPosts();

function updateCategoryDescription(){
 const box=$('categoryDescText');if(!box)return;
 const message=category==='홈'?categoryDescriptionsDefault:(categoryDescriptions[category]??categoryDescriptionsDefault);
 box.textContent=message;
 const btn=$('editCategoryDescBtn');if(btn)btn.classList.toggle('hidden',category==='홈'||!member?.is_admin);
}
function deckGroupKey(title){
 // 공백/쉼표로 구분된 캐릭터 이름의 순서만 무시한다. 붙여 쓴 이름은 분리하지 않는다.
 const names=String(title||'').normalize('NFKC').toLocaleLowerCase('ko-KR').split(/[\s,，、]+/u).filter(Boolean);
 return JSON.stringify(names.sort((a,b)=>a.localeCompare(b,'ko')));
}
const expandedGuideGroups=new Set();
function toggleGuideGroup(key){
 if(expandedGuideGroups.has(key)) expandedGuideGroups.delete(key); else expandedGuideGroups.add(key);
 renderPosts();
}
function statusInfo(status){
 const x=status||'검증완료';
 if(x==='테스트중')return {label:'🧪 테스트중',cls:'status-testing'};
 if(x==='구버전')return {label:'⚠️ 구버전',cls:'status-old'};
 return {label:'✅ 검증완료',cls:'status-verified'};
}
function renderPostCard(p){
 const canEdit=member?.is_admin||String(p.author_id)===String(member?.id);
 const imgs=getImages(p),st=statusInfo(p.status);
 return `<div class="post"><span class="badge">${esc(p.category||p.cat||'공략')}</span><span class="status-badge ${st.cls}">${st.label}</span><div class="title">${esc(p.title)}</div><div class="post-author">✍️ 작성자 · ${esc(p.author_nickname||'알 수 없음')}</div><div class="small">${new Date(p.created_at||Date.now()).toLocaleDateString('ko-KR')}</div><div class="post-body">${esc(p.content??p.body??'')}</div>${imgs.length?`<div class="image-grid">${imgs.map(u=>`<img src="${esc(u)}" loading="lazy">`).join('')}</div>`:''}<div class="post-actions">${canEdit?`<button class="iconbtn" onclick='editById(${JSON.stringify(String(p.id))})'>수정</button><button class="iconbtn" onclick='deletePost(${JSON.stringify(String(p.id))})'>삭제</button>`:''}<button type="button" class="iconbtn" onclick='event.stopPropagation();openComments(${JSON.stringify(String(p.id))})'>💬 댓글 ${commentCounts[String(p.id)]||0}</button><button type="button" class="iconbtn" onclick='event.stopPropagation();addSameTitleById(${JSON.stringify(String(p.id))})'>➕ 추가</button></div></div>`;
}
function deckTokens(title){
 // Titles are character names separated by whitespace or commas; concatenated names stay one token.
 return [...new Set(String(title||'').normalize('NFKC').split(/[\s,，、]+/u).map(x=>x.trim()).filter(Boolean))];
}
function toggleCharacter(name){
 if(selectedCharacters.has(name))selectedCharacters.delete(name);else selectedCharacters.add(name);
 renderPosts();
}
function clearCharacters(){selectedCharacters.clear();renderPosts();}
function renderPosts(){
 updateCategoryDescription();
 if(category==='홈'){$('welcome').textContent='불사 길드';renderHome();return;}
 const q=($('searchInput')?.value||'').trim().toLocaleLowerCase('ko-KR');
 const terms=q.split(/\s+/).map(normalizeGuideTitle).filter(Boolean);
 const categoryPosts=posts.filter(p=>category==='전체'||(p.category||p.cat)===category);
 const guildWarMode=category==='길드전';
 const allCharacters=guildWarMode?[...new Map(categoryPosts.flatMap(p=>deckTokens(p.title)).map(x=>[x.toLocaleLowerCase('ko-KR'),x])).values()].sort((a,b)=>a.localeCompare(b,'ko')):[];
 // Drop selections no longer present in this category.
 for(const name of selectedCharacters){if(!allCharacters.some(x=>x.toLocaleLowerCase('ko-KR')===name.toLocaleLowerCase('ko-KR')))selectedCharacters.delete(name);}
 const a=categoryPosts.filter(p=>{
   const tokens=deckTokens(p.title).map(x=>x.toLocaleLowerCase('ko-KR'));
   return (!guildWarMode||[...selectedCharacters].every(x=>tokens.includes(x.toLocaleLowerCase('ko-KR')))) && (!terms.length||terms.every(term=>normalizeGuideTitle(p.title).includes(term)));
 });
 $('welcome').textContent=category==='전체'?'불사 공략실':category+' 공략';
 const chips=guildWarMode?`<div class="character-filter"><div class="filter-heading">🔎 캐릭터별 공략 찾기</div><div class="filter-hint">여러 명을 선택하면 모두 포함된 덱만 나옵니다. · 제목에서 자동 생성</div><div class="filter-chips"><button class="filter-chip ${selectedCharacters.size===0?'selected':''}" onclick="clearCharacters()">전체</button>${allCharacters.map(n=>`<button class="filter-chip ${selectedCharacters.has(n)?'selected':''}" onclick='toggleCharacter(${JSON.stringify(n)})'>${esc(n)}</button>`).join('')}</div></div>`:'';
 if(!a.length){$('postList').innerHTML=chips+`<div class="card"><div class="small">${q||selectedCharacters.size?'조건에 맞는 공략이 없습니다.':'등록된 공략이 없습니다.'}</div></div>`;return;}
 const groups=new Map();
 a.forEach(p=>{const key=deckGroupKey(p.title);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p)});
 $('postList').innerHTML=chips+`<div class="small" style="margin:0 0 10px">📚 ${groups.size}개 덱 · 공략 ${a.length}개</div>`+[...groups.entries()].map(([key,group])=>{
   const first=group[0],open=expandedGuideGroups.has(key),authors=[...new Set(group.map(p=>p.author_nickname||'알 수 없음'))];
   const tokens=deckTokens(first.title);
   return guildWarMode?`<div class="deck-card" onclick='toggleGuideGroup(${JSON.stringify(key)})'><div class="deck-head"><div class="deck-name">${esc(tokens.join(' · '))}</div><span class="deck-count">공략 ${group.length}개</span></div><div class="deck-tags" style="margin-top:9px">${tokens.map(n=>`<span class="deck-chip ${selectedCharacters.has(n)?'selected':''}">${esc(n)}</span>`).join('')}</div><div class="deck-meta">✍️ ${esc(authors.join(' · '))}</div><div class="deck-expand">${open?'▲ 공략 접기':'▼ 공략 펼쳐보기'}</div></div>${open?`<div style="padding-left:9px;border-left:2px solid #76200f">${group.map(renderPostCard).join('')}</div>`:''}`:`<div class="card" style="cursor:pointer" onclick='toggleGuideGroup(${JSON.stringify(key)})'><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><strong>${esc(first.title)}</strong><span class="small">공략 ${group.length}개</span></div><div class="small" style="margin-top:6px">✍️ ${esc(authors.join(' · '))} · ${open?'▲ 접기':'▼ 펼치기'}</div></div>${open?`<div style="padding-left:9px;border-left:2px solid #76200f">${group.map(renderPostCard).join('')}</div>`:''}`;
 }).join('');
}

async function loadSiteData(){
 const [{data:ms},{data:no,error}]=await Promise.all([sb.from('members').select('id,nickname,approved,is_admin'),sb.from('guild_notices').select('*').order('id',{ascending:true}).limit(1).maybeSingle()]);
 battleMembers=ms||[];
 if(error)console.warn('공지 불러오기 오류',error);
 noticeRow=no||null;

 $('postList').innerHTML=`<div class="card notice-home"><h2>📢 길드 공지</h2><div class="post-body">${esc(notice)}</div>${member?.is_admin?`<div style="height:10px"></div><button class="btn gold" onclick="editNotice()">공지 수정</button>`:''}</div><img class="home-image" src="./home.png?v=1" alt="불사 길드 홍보 이미지">`;

async function editNotice(){
 if(!member?.is_admin)return;

 if(res.error)return alert('공지 저장 오류: '+res.error.message);

function getImages(p){
 if(Array.isArray(p.image_urls)) return p.image_urls.filter(Boolean);
 if(typeof p.image_urls==='string'){try{const a=JSON.parse(p.image_urls);if(Array.isArray(a))return a.filter(Boolean)}catch(e){}}
 if(typeof p.image_url==='string' && p.image_url.trim().startsWith('[')){try{const a=JSON.parse(p.image_url);if(Array.isArray(a))return a.filter(Boolean)}catch(e){}}
 return p.image_url?[p.image_url]:[];
}
function addSameTitleById(id){
  const p=posts.find(x=>String(x.id)===String(id));
  if(!p){alert('공략 정보를 찾지 못했습니다. 새로고침 후 다시 눌러주세요.');return;}
  openPostEditor(null,{category:p.category||p.cat||'길드전',title:p.title||''});
}

function openPostEditor(p=null,preset=null){
 $('modalBox').innerHTML=`<h2>${p?'공략 수정':'공략 작성'}</h2><select id="pCat"><option>길드전</option><option>공성전</option><option>파괴신</option></select><input id="pTitle" placeholder="제목" value="${esc(p?.title||preset?.title||'')}"><textarea id="pBody" placeholder="공략 내용">${esc(p?.content??p?.body??'')}</textarea><label style="display:block;font-weight:900;margin-top:4px">🏷️ 공략 상태</label><select id="pStatus"><option value="검증완료">✅ 검증완료</option><option value="테스트중">🧪 테스트중</option><option value="구버전">⚠️ 구버전</option></select><label class="upload-label" for="pImages">📷 사진 선택 (여러 장 가능)</label><input id="pImages" type="file" accept="image/*" multiple style="display:none" onchange="showFileCount()"><div id="fileCount" class="upload-note">${p&&getImages(p).length?'기존 사진 '+getImages(p).length+'장 · 새 사진을 선택하면 추가됩니다.':'선택된 사진 없음'}</div><button class="btn" onclick="savePost('${p?.id||''}')">저장</button><div style="height:8px"></div><button class="btn secondary" onclick="closeModal()">취소</button>`;
 $('modal').classList.remove('hidden');
 if(p){
  $('pCat').value=(p.category||p.cat)==='강림'?'공성전':(p.category||p.cat||'길드전');
}else if(preset){
  $('pCat').value=(preset.category==='강림'?'공성전':preset.category||'길드전');
}else if(category==='길드전'||category==='공성전'||category==='파괴신'){
  $('pCat').value=category;
}
}
function showFileCount(){const n=$('pImages').files.length;$('fileCount').textContent=n?`${n}장 선택됨`:'선택된 사진 없음'}
async function uploadImages(files){
 const urls=[];
 for(const file of files){
   const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
   const path=`${member.id}/${Date.now()}-${crypto.randomUUID()}.${ext}`;
   const {error}=await sb.storage.from('guide-images').upload(path,file,{upsert:false,contentType:file.type||undefined});
   if(error)throw error;
   const {data}=sb.storage.from('guide-images').getPublicUrl(path);
   urls.push(data.publicUrl);
 }
 return urls;
}
async function savePost(id){
 if(!member?.approved)return alert('승인된 길드원만 작성할 수 있습니다.');
 const title=$('pTitle').value.trim(),content=$('pBody').value.trim();
 if(!title)return alert('제목을 입력하세요.');
 const old=id?posts.find(x=>String(x.id)===String(id)):null;
 if(id && !member.is_admin && String(old?.author_id)!==String(member.id))return alert('자기가 작성한 공략만 수정할 수 있습니다.');
 const btn=document.querySelector('#modalBox .btn'); if(btn){btn.disabled=true;btn.textContent='저장 중...'}
 try{
   const newUrls=await uploadImages(Array.from($('pImages').files||[]));
   const allUrls=[...getImages(old||{}),...newUrls];
   const payload={category:$('pCat').value,title,content,status:$('pStatus')?.value||'검증완료',author_id:old?.author_id||member.id,updated_at:new Date().toISOString()};
   // Current DB has image_url; multiple URLs are stored as JSON text there for compatibility.
   payload.image_url=allUrls.length?JSON.stringify(allUrls):null;
   let res=id?await sb.from('guides').update(payload).eq('id',id):await sb.from('guides').insert(payload);
   if(res.error)throw res.error;
   closeModal();await loadPosts();if(!$('adminView').classList.contains('hidden'))await renderAdmin();
 }catch(e){alert('저장 오류: '+(e?.message||e))}
 finally{if(btn){btn.disabled=false;btn.textContent='저장'}}
}




async function loadNotifications(){
 if(!member)return;
 const myGuideIds=posts.filter(p=>String(p.author_id)===String(member.id)).map(p=>Number(p.id));
 if(!myGuideIds.length){myNotifications=[];updateBell();return;}
 const [{data:comments,error},{data:reads},{data:members}]=await Promise.all([
   sb.from('guide_comments').select('*').in('guide_id',myGuideIds).neq('author_id',member.id).order('created_at',{ascending:false}),
   sb.from('comment_notifications').select('*').eq('user_id',member.id),
   sb.from('members').select('id,nickname')
 ]);
 if(error){console.warn('알림 불러오기 오류',error);return;}
 const readMap=Object.fromEntries((reads||[]).map(r=>[String(r.comment_id),r]));
 const names=Object.fromEntries((members||[]).map(m=>[String(m.id),m.nickname]));
 myNotifications=(comments||[]).map(c=>{
   const guide=posts.find(p=>String(p.id)===String(c.guide_id));
   return {...c,guide_title:guide?.title||'공략',commenter:names[String(c.author_id)]||'길드원',read_at:readMap[String(c.id)]?.read_at||null};
 });
 updateBell();
}
function updateBell(){
 const bell=$('notifyBell'),badge=$('notifyCount');if(!bell||!badge)return;
 const unread=myNotifications.filter(n=>!n.read_at).length;
 bell.classList.toggle('has-unread',unread>0);
 badge.textContent=unread>99?'99+':String(unread);
 badge.classList.toggle('hidden',unread===0);
}
async function openNotifications(){
 await loadNotifications();
 $('modalBox').innerHTML=`<h2>🔔 댓글 알림</h2><div class="small">내가 작성한 공략에 달린 댓글입니다.</div><div style="height:8px"></div>${myNotifications.map(n=>`<button class="notification-item ${n.read_at?'':'unread'}" onclick="openNotificationComment(${n.id},${n.guide_id})"><div class="notification-title">${n.read_at?'💬':'🟡'} 내 공략에 댓글이 달렸습니다.</div><div><b>${esc(n.guide_title)}</b></div><div class="notification-meta">${esc(n.commenter)} · ${new Date(n.created_at).toLocaleString('ko-KR')}</div></button>`).join('')||'<div class="card"><div class="small">아직 댓글 알림이 없습니다.</div></div>'}<button class="btn secondary" onclick="closeModal()">닫기</button>`;
 $('modal').classList.remove('hidden');
}
async function openNotificationComment(commentId,guideId){
 const now=new Date().toISOString();
 const {error}=await sb.from('comment_notifications').upsert({user_id:member.id,comment_id:Number(commentId),read_at:now},{onConflict:'user_id,comment_id'});
 if(error)return alert('알림 확인 처리 오류: '+error.message);
 const n=myNotifications.find(x=>String(x.id)===String(commentId));if(n)n.read_at=now;updateBell();
 await openComments(String(guideId));
}
async function openComments(guideId){
 const p=posts.find(x=>String(x.id)===String(guideId));if(!p)return;
 const [{data:cs,error},{data:ms}]=await Promise.all([sb.from('guide_comments').select('*').eq('guide_id',guideId).order('created_at',{ascending:true}),sb.from('members').select('id,nickname')]);
 if(!error&&String(p.author_id)===String(member.id)){
   const unread=(cs||[]).filter(c=>String(c.author_id)!==String(member.id));
   if(unread.length){
     await sb.from('comment_notifications').upsert(unread.map(c=>({user_id:member.id,comment_id:c.id,read_at:new Date().toISOString()})),{onConflict:'user_id,comment_id'});
     await loadNotifications();
   }
 }
 if(error)return alert('댓글 불러오기 오류: '+error.message);
 const names=Object.fromEntries((ms||[]).map(m=>[String(m.id),m.nickname]));
 $('modalBox').innerHTML=`<h2>💬 댓글 · ${esc(p.title)}</h2><div id="commentList">${(cs||[]).map(c=>`<div class="comment"><div class="comment-head"><b>${esc(names[String(c.author_id)]||'알 수 없음')}</b><span>${new Date(c.created_at).toLocaleString('ko-KR')}</span></div><div>${esc(c.content)}</div>${(member?.is_admin||String(c.author_id)===String(member?.id))?`<button class="mini-btn" style="margin-top:7px" onclick="deleteComment(${c.id},'${guideId}')">삭제</button>`:''}</div>`).join('')||'<div class="small">아직 댓글이 없습니다.</div>'}</div><textarea id="commentText" style="min-height:90px" maxlength="500" placeholder="댓글을 입력하세요."></textarea><button class="btn" onclick="saveComment('${guideId}')">댓글 등록</button><div style="height:8px"></div><button class="btn secondary" onclick="closeModal()">닫기</button>`;
 $('modal').classList.remove('hidden');
}
async function saveComment(guideId){
 const content=$('commentText').value.trim();if(!content)return alert('댓글 내용을 입력해주세요.');
 const {error}=await sb.from('guide_comments').insert({guide_id:Number(guideId),author_id:member.id,content});
 if(error)return alert('댓글 등록 오류: '+error.message);await loadPosts();await loadNotifications();await openComments(guideId);
}
async function deleteComment(id,guideId){
 if(!confirm('댓글을 삭제할까요?'))return;
 const {error}=await sb.from('guide_comments').delete().eq('id',id);if(error)return alert('댓글 삭제 오류: '+error.message);await loadPosts();await loadNotifications();await openComments(guideId);
}

function openMyPage(){
 if(!member)return;
 $('modalBox').innerHTML=`<h2>👤 마이페이지</h2>
 <div class="card" style="margin-top:12px">
   <div class="small">현재 표시 닉네임</div>
   <div style="font-size:22px;font-weight:1000;margin-top:5px">${esc(member.nickname||'')}</div>
 </div>
 <button class="btn" onclick="openNicknameEditor()">✏️ 닉네임 변경</button>
 <div style="height:8px"></div>
 <button class="btn secondary" onclick="closeModal()">닫기</button>`;
 $('modal').classList.remove('hidden');
}
function openNicknameEditor(targetId=null){
 const target=targetId?battleMembers.find(x=>String(x.id)===String(targetId)):member;
 if(!target)return;
 if(targetId&&!member?.is_admin)return alert('관리자만 다른 길드원의 닉네임을 변경할 수 있습니다.');
 $('modalBox').innerHTML=`<h2>✏️ 닉네임 변경</h2><div class="small">사이트에 표시되는 닉네임만 변경됩니다.<br>로그인할 때 사용하는 기존 닉네임은 그대로입니다.</div><input id="newNickname" maxlength="30" placeholder="새 표시 닉네임" value="${esc(target.nickname||'')}"><button class="btn" onclick="saveNickname('${target.id}')">변경 저장</button><div style="height:8px"></div><button class="btn secondary" onclick="closeModal()">취소</button>`;
 $('modal').classList.remove('hidden');
}
async function saveNickname(targetId){
 const nickname=$('newNickname').value.trim();
 if(!nickname)return alert('새 닉네임을 입력해주세요.');
 if(nickname.length>30)return alert('닉네임은 30자 이하로 입력해주세요.');
 if(String(targetId)!==String(member?.id)&&!member?.is_admin)return alert('본인 닉네임만 변경할 수 있습니다.');
 const {error}=await sb.from('members').update({nickname}).eq('id',targetId);
 if(error)return alert('닉네임 변경 오류: '+error.message);
 if(String(targetId)===String(member.id)){member.nickname=nickname;$('who').textContent=nickname+'님 환영합니다.';}
 closeModal();await loadPosts();await loadSiteData();
 if(!$('adminView').classList.contains('hidden'))await renderAdmin();
 alert('표시 닉네임이 변경되었습니다.\n로그인할 때는 기존 닉네임을 사용해주세요.');
}
async function openAdmin(){if(!member?.is_admin)return alert('관리자만 들어갈 수 있습니다.');show('adminView');await renderAdmin()}
function backApp(){show('appView')}
async function renderAdmin(){const {data:ms,error}=await sb.from('members').select('*').order('approved',{ascending:true});if(error){$('members').innerHTML='<div class="small">'+esc(error.message)+'</div>';return}const approvedCount=(ms||[]).filter(m=>m.approved).length;if($('memberCount'))$('memberCount').textContent=`(${approvedCount}명)`;$('members').innerHTML=(ms||[]).map(m=>`<div class="member"><div><strong>${esc(m.nickname)} ${m.is_admin?'👑':''}</strong><span>${m.approved?(m.is_admin?'관리자':'승인된 길드원'):'승인 대기'}</span></div><div class="row">${m.approved?`<button class="iconbtn" onclick="openNicknameEditor(\'${m.id}\')">닉네임</button>`:''}${!m.approved?`<button class="iconbtn" onclick="approveMember('${m.id}')">승인</button>`:''}${m.id!==member.id?`<button class="iconbtn" onclick="kickMember('${m.id}','${esc(m.nickname)}')">추방</button>`:''}</div></div>`).join('')||'<div class="small">회원이 없습니다.</div>';$('adminPosts').innerHTML=posts.map(p=>`<div class="member"><div><strong>${esc(p.title)}</strong><span>${esc(p.category||p.cat||'공략')}</span></div><div class="row"><button class="iconbtn" onclick='editById(${JSON.stringify(String(p.id))})'>수정</button><button class="iconbtn" onclick='deletePost(${JSON.stringify(String(p.id))})'>삭제</button></div></div>`).join('')||'<div class="small">공략이 없습니다.</div>'}
async function approveMember(id){const {error}=await sb.from('members').update({approved:true}).eq('id',id);if(error)return alert(error.message);await renderAdmin()}
async function kickMember(id,nick){if(!confirm(nick+' 님을 추방할까요?'))return;const {error}=await sb.from('members').delete().eq('id',id);if(error)return alert(error.message);await renderAdmin()}
function editById(id){const p=posts.find(x=>String(x.id)===String(id));if(p)openPostEditor(p)}
async function deletePost(id){const p=posts.find(x=>String(x.id)===String(id));if(!member?.is_admin&&String(p?.author_id)!==String(member?.id))return alert('자기가 작성한 공략만 삭제할 수 있습니다.');if(!confirm('이 공략을 삭제할까요?'))return;const {error}=await sb.from('guides').delete().eq('id',id);if(error)return alert(error.message);await loadPosts();await renderAdmin()}
function closeModal(){$('modal').classList.add('hidden')}$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session?.user)await enterWithUser(session.user)})();
</script></body></html>
